name: Release

# Pushing a `v*` tag (see `mise run release`) builds the plugin for every supported platform, signs
# the archives with packslip and publishes a GitHub release. Running the workflow manually only
# builds the archives.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read # check out the repository
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
      - name: Check that the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${VERSION}" ]; then
            echo "::error::Tag ${VERSION} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - name: Install the Rust target
        run: mise exec -- rustup target add "${TARGET}"
      - name: Build and package
        run: mise run package --target "${TARGET}" --version "${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nu_plugin_pcf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Signing runs apart from the release job, without write access to the repository, as
  # https://packslip.dev/docs/publishing/ recommends.
  sign:
    name: Sign
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository metadata
      id-token: write # sign with the workflow's identity
      attestations: write # attest the archives
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: nu_plugin_pcf-*
          merge-multiple: true
      # The musl build is statically linked, but packslip reads `musl` in an archive name as a
      # dependency on musl's C library and would not offer the archive to glibc hosts.
      - name: Describe the Linux build as static
        run: |
          for archive in dist/*-linux-musl.tar.gz; do
            printf '[[artifact]]\npath = "%s"\nlibc = "any"\n' "${archive}"
          done > "${RUNNER_TEMP}/release.toml"
      - uses: jdx/packslip@7b32cd29a9240927882ee18b3db1dcfd8e0328b4 # v1.7.0
        id: packslip
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: nu_plugin_pcf
          manifest: ${{ runner.temp }}/release.toml
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: git-cliff
      # The archives and the packslip bundle.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Generate release notes
        run: git cliff --latest --strip header --output RELEASE_NOTES.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # The release stays a draft until every file is attached, which immutable releases
          # require.
          gh release create "${TAG}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            dist/packslip.sigstore.json \
            --draft \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${flags[@]}"
          gh release edit "${TAG}" --draft=false
